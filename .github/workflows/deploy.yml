name: Deploy Vytronix

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vytronix-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: [self-hosted, Linux, X64, vytronix-server-vytronix]

    steps:
      - name: Update production repository
        working-directory: /srv/vytronix/apps/vytronix/app
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Validate Docker Compose
        working-directory: /srv/vytronix/apps/vytronix
        run: |
          docker compose --env-file .env.build config --quiet

      - name: Build Vytronix
        working-directory: /srv/vytronix/apps/vytronix
        run: |
          docker compose --env-file .env.build build app

      - name: Deploy Vytronix
        working-directory: /srv/vytronix/apps/vytronix
        run: |
          docker compose --env-file .env.build up -d --no-deps app

      - name: Verify container
        run: |
          for attempt in $(seq 1 30); do
            if docker exec vytronix-app node -e "
              fetch('http://127.0.0.1:3000/', {
                headers: {
                  'user-agent': 'Mozilla/5.0',
                  'accept': 'text/html'
                }
              }).then(r => {
                console.log('HTTP', r.status);
                process.exit(r.ok ? 0 : 1);
              }).catch(() => process.exit(1));
            "; then
              echo "Vytronix is ready."
              exit 0
            fi

            echo "Waiting for Vytronix... attempt ${attempt}/30"
            sleep 2
          done

          echo "Vytronix did not become ready within 60 seconds."
          docker logs --tail 50 vytronix-app
          exit 1
